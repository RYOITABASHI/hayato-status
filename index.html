<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ハヤト作業ボード</title>
<style>
  :root{ --bg:#f4f4f6; --card:#ffffff; --text:#17181c; --muted:#6b7280; --border:#e3e4e8; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#101114; --card:#1b1c20; --text:#f2f3f5; --muted:#9aa1ad; --border:#2c2e35; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:18px 14px 40px; }
  h1{ font-size:19px; margin:2px 0 2px; }
  .upd{ color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .row{ display:flex; gap:9px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .dot{ flex:none; width:9px; height:9px; border-radius:50%; margin-top:6px; }
  .done{ background:#2fbf71; } .prog{ background:#f5a623; } .wait{ background:#8a94a6; }
  .main{ flex:1; min-width:0; }
  .t{ font-weight:600; font-size:14.5px; line-height:1.4; }
  .d{ font-size:13px; color:var(--muted); line-height:1.5; margin-top:1px; }
  .s{ flex:none; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--bg); color:var(--muted); border:1px solid var(--border); margin-top:2px; }
  .foot{ color:var(--muted); font-size:11.5px; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ハヤト作業ボード</h1>
  <div class="upd" id="upd">読み込み中…</div>
  <div id="list"></div>
  <div class="foot">60秒ごとに自動更新</div>
</div>
<script>
const FALLBACK = {"tasks":[{"badge":"完了","detail":"プライベート DNS で解決。再生 OK、再発したら報告","status":"done","title":"YouTube 再生・広告ブロック"},{"badge":"完了","detail":"PR #191/#192 ともにマージ済み。本番 3043 に含まれ、オーナー導入済み","status":"done","title":"Shelly MCP 読み取り改善（D6）"},{"badge":"完了","detail":"systemd 常駐化・ポート自動追随・rebind 常設まで全件完了。切断→復旧は 20 秒に短縮","status":"done","title":"adb 基盤（D1〜D3）"},{"badge":"進行中","detail":"build 99 稼働中（Shizuku 自動復旧＋結果報告の修正）。頭脳移行 r7a は隔離版でゲート中","status":"prog","title":"ClosePaw 本体（D4+D5）"},{"badge":"完了","detail":"権限付与（pm grant）と型付き操作の実機検証まで完了","status":"done","title":"ClosePaw 権限まわり"},{"badge":"完了","detail":"systemd 常駐。force-stop から復旧検証まで 9 秒を実証","status":"done","title":"ClosePaw rebind 常設化"},{"badge":"検証完了","detail":"本体は実機検証 OK。結果の読み戻し改善はゲート通過後に次ビルドへ","status":"done","title":"stage_install（無人インストール）"},{"badge":"完了","detail":"外出中の縮退運用を実地で実証済み（約3時間）","status":"done","title":"MCP 縮退モード（Phase B）"},{"badge":"実証完了","detail":"Metro 接続成功（localhost/adb reverse）。編集→反映は数秒、初回バンドル転送のみ数分","status":"done","title":"Shelly .dev 実証（Metro）"},{"badge":"完了","detail":"本番 3043（CI シャーディング込み）をオーナーが導入済み","status":"done","title":"Shelly 本番ビルド"},{"badge":"完了","detail":"Shelly のテスト分割で 1,680秒→1,257秒（-25%）。ClosePaw の3ジョブ化で約 -9%","status":"done","title":"CI 短縮"},{"badge":"進行中","detail":"首脳陣（Perplexity＋ChatGPT＋ハヤト）の合意案で実装済み。文面ゲート通過後に PR","status":"prog","title":"Shelly README 改修"},{"badge":"完了","detail":"Metro 実測完了（編集→反映 4 秒）。通常版 build-7 に復帰済み","status":"done","title":"council アプリ"},{"badge":"保留","detail":"PARTIAL で確定。proof2 の作り直しは ClosePaw 側の後続","status":"wait","title":"VD Phase 0"}],"updatedAt":"2026-11-23 02:33 JST"};
function render(data){
  document.getElementById('upd').textContent = '最終更新：' + data.updatedAt;
  const list = document.getElementById('list');
  list.innerHTML = '';
  for(const task of data.tasks){
    const row = document.createElement('div'); row.className = 'row';
    const dot = document.createElement('span'); dot.className = 'dot ' + task.status;
    const main = document.createElement('div'); main.className = 'main';
    const t = document.createElement('div'); t.className = 't'; t.textContent = task.title;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = task.detail;
    main.appendChild(t); main.appendChild(d);
    const s = document.createElement('span'); s.className = 's'; s.textContent = task.badge;
    row.appendChild(dot); row.appendChild(main); row.appendChild(s);
    list.appendChild(row);
  }
}
async function load(){
  try{
    const res = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    render(await res.json());
  }catch(e){ render(FALLBACK); }
}
render(FALLBACK);
load();
setInterval(load, 60000);
</script>
</body>
</html>
